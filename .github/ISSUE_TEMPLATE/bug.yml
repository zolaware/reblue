name: Bug report
description: Something looks, sounds or plays wrong.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in every field. If re:Blue closed
        unexpectedly, use the crash report form instead.

        Logs are in the `logs` folder of your re:Blue install, one
        `reblue_NNN.log` per run. The highest number is the newest.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues.
          required: true
  - type: dropdown
    id: channel
    attributes:
      label: Build channel
      description: Reproduce on the latest stable release or the latest dev nightly before reporting.
      options:
        - Latest stable release
        - Latest dev nightly
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Build
      description: The first lines of the log.
      placeholder: |
        re:Blue v1.4.0.153 [Release] win-amd64
        commit 187173d85 on HEAD, built 20261122_1740 with Clang 22.1.8
        sdk: rexglue-v0.12.0-dev.g44b7fdc5-win-amd64-Release@20261122_1525
      render: text
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux AppImage
        - Steam Deck
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - reblue.exe (Windows/D3D12)
        - reblue_vk.exe (Windows/Vulkan)
        - macOS (MoltenVK)
        - Linux (Vulkan)
        - Other (Proton, Wine, etc.)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: NVIDIA GeForce RTX 3060, driver 566.36
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: Resolution
      placeholder: 1920x1080
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Disc image
        - GOD ISO
        - Other
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Languages
      placeholder: Spanish text, English voice
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods and content packs
      description: Everything enabled, or none.
      placeholder: generated_minimaps, jp_fonts, phoenix_fix
    validations:
      required: true
  - type: textarea
    id: dlc
    attributes:
      label: DLC
      description: Everything installed, or none.
      placeholder: Shuffle Dungeon, 6 Treasures, Ultra Hard Mode
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Location
      description: The map or area, and what you were doing.
      placeholder: Mural Town plaza, opening the camp menu after a battle.
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: How often
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load a save in Mural Town.
        2. Walk into the plaza.
        3. Open the camp menu.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
    validations:
      required: false
  - type: dropdown
    id: other_backend
    attributes:
      label: Same with the other backend?
      description: On Windows, try both reblue.exe and reblue_vk.exe.
      options:
        - "Yes"
        - "No"
        - Did not try
        - Not available
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach the log from the run with the bug. Zip it if it is too large.
    validations:
      required: false
