name: Crash report
description: re:Blue closed, froze or showed a crash message.
title: "[Crash] "
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in every field.

        Logs are in the `logs` folder of your re:Blue install, one
        `reblue_NNN.log` per run. The highest number is the newest. Attach
        the one from the run that crashed.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues.
          required: true
  - type: dropdown
    id: channel
    attributes:
      label: Build channel
      description: Reproduce on the latest stable release or the latest dev nightly before reporting.
      options:
        - Latest stable release
        - Latest dev nightly
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Build
      description: The first lines of the log.
      placeholder: |
        re:Blue v1.4.0.153 [Release] win-amd64
        commit 187173d85 on HEAD, built 20261122_1740 with Clang 22.1.8
        sdk: rexglue-v0.12.0-dev.g44b7fdc5-win-amd64-Release@20261122_1525
      render: text
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux AppImage
        - Steam Deck
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - reblue.exe (Windows/D3D12)
        - reblue_vk.exe (Windows/Vulkan)
        - macOS (MoltenVK)
        - Linux (Vulkan)
        - Other (Proton, Wine, etc.)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: NVIDIA GeForce RTX 3060, driver 566.36
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: Resolution
      placeholder: 1920x1080
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Disc image
        - GOD ISO
        - Other
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Languages
      placeholder: Spanish text, English voice
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods and content packs
      description: Everything enabled, or none.
      placeholder: generated_minimaps, jp_fonts, phoenix_fix
    validations:
      required: true
  - type: textarea
    id: dlc
    attributes:
      label: DLC
      description: Everything installed, or none.
      placeholder: Shuffle Dungeon, 6 Treasures, Ultra Hard Mode
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Location
      description: The map or area, and what you were doing.
      placeholder: Walking in map dg12_09 on disc 1, about 17 seconds after entering.
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: How often
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: crash_text
    attributes:
      label: Crash message
      description: The message shown, or the "exception:" line and backtrace near the end of the log.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach the log from the run that crashed. Zip it if it is too large.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A crash dump, a save from just before the crash, or whether the other backend crashes too.
    validations:
      required: false
