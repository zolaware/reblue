name: Build Windows

# Builds reblue.exe (D3D12) and reblue_vk.exe (Vulkan), both of which ship.
# Step bodies live in .github/scripts.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit-ish to build (empty = the caller's ref)"
        required: false
        type: string
        default: ""
      sdk_tag:
        description: "rexglue-sdk release tag to build against"
        required: true
        type: string
      asset_base:
        description: "Asset name stem, from _resolve.yml"
        required: true
        type: string
      update_channel:
        description: "Manifest channel this build checks: stable or nightly"
        required: false
        type: string
        default: stable
      version_suffix:
        description: "Appended to the project version, e.g. .417 for a nightly"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  SDK_REPO: rexglue/rexglue-sdk
  SDK_TAG: ${{ inputs.sdk_tag }}
  ASSETS_REPO: zolaware/reblue-assets
  PRESET: win-amd64-release
  REBLUE_UPDATE_BASE: ${{ vars.UPDATE_BASE_URL }}
  REBLUE_UPDATE_CHANNEL: ${{ inputs.update_channel }}
  REBLUE_VERSION_SUFFIX: ${{ inputs.version_suffix }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install LLVM, CMake, Ninja
        run: choco install llvm cmake ninja -y

      # The preset reads $env{VCPKG_ROOT}, but the runner only exports
      # VCPKG_INSTALLATION_ROOT.
      - name: Point vcpkg at the preinstalled root
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: win-amd64

      - name: Fetch ReXGlue SDK (${{ inputs.sdk_tag }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: ./.github/scripts/fetch-deps.ps1

      - name: Enter the Visual Studio environment
        shell: pwsh
        run: ./.github/scripts/vsdevshell.ps1

      - name: Configure
        shell: pwsh
        run: ./.github/scripts/configure.ps1

      - name: Codegen
        run: cmake --build --preset $env:PRESET --target reblue_codegen

      - name: Reconfigure (pick up generated/sources.cmake)
        shell: pwsh
        run: ./.github/scripts/configure.ps1

      - name: Build
        run: cmake --build --preset $env:PRESET -j

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package
        shell: pwsh
        env:
          OUT_FILE: ${{ inputs.asset_base }}-win-amd64.zip
        run: ./.github/scripts/package-windows.ps1

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: reblue-win-amd64
          path: dist/*.zip
          if-no-files-found: error

      # Not reblue-*, so the publish job can download symbols on their own.
      - name: Upload symbols
        uses: actions/upload-artifact@v6
        with:
          name: symbols-win-amd64
          path: dist/symbols/*.zip
          if-no-files-found: error
