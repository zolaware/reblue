# Battle lifecycle (bodies in src/engine/battle_camera_task.cpp).

# BattleCameraTask's destructor, at the merge point past its own free of
# this+0x9C. That clear of the global the battle-active answer comes from is the
# only one in the title, so it is the battle exit edge. Placed here rather than
# on the store itself because the store sits inside the free's argument window,
# where a subscriber running engine code would corrupt the pointer being freed.
[[midasm_hook]]
address = 0x8225432C
name = "bdBattleCameraDestroyHook"
registers = []
after_instruction = false
