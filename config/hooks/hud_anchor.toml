# Screen edge HUD anchoring for non-16:9 render rects (bodies in
# src/engine/hud_anchor.cpp).

# CompassTask::vf03 loads the compass center (1113.6, 610.0) into f28 for x and
# f29 for y, both nonvolatile and neither rewritten before the second of its two
# bdPrimDrawRectRotated calls. The first call's y is staged into f2 ahead of the
# x load though, so moving only the nonvolatile pair leaves that call behind and
# tears the dial ring off the needle. Sits on the f1 copy instead, where the
# first call's arguments are complete and the second's source is still live.
[[midasm_hook]]
address = 0x8239CCD0
name = "bdCompassNeedleAnchorHook"
registers = ["f1", "f2", "f28", "f29"]
after_instruction = true

# The dial underneath, drawn by bdPrimDrawRect2D from its top-left corner
# (1049.6, 546.0). f2 holds y from four instructions up.
[[midasm_hook]]
address = 0x8239CD34
name = "bdCompassDialAnchorHook"
registers = ["f1", "f2"]
after_instruction = true

# MiniMapTask's widget draw loads its center (1120.0, 588.0) into f25 and f26
# once and never rewrites either, so one point covers all five draws. It sits
# after the copy into f1/f2 because the first call's arguments are staged before
# f26 is even loaded, and moving only the pair the later calls read would tear
# the map disc off its frame.
[[midasm_hook]]
address = 0x8239B098
name = "bdMiniMapAnchorHook"
registers = ["f1", "f2", "f25", "f26"]
after_instruction = true

# The map layer's own push helper, called once by the widget above and reached
# from nowhere else. It takes a center and then discards it, adding its own
# (1120.0, 588.0) to each corner instead, so the widget's hook does not carry
# here. f29 and f30 are loaded just before the four-corner loop and read inside
# it.
[[midasm_hook]]
address = 0x82149668
name = "bdMiniMapLayerAnchorHook"
registers = ["f29", "f30"]
after_instruction = true

# The close-up view's outline, read by two loops. First by the one copying it
# into the camera view as the composite quad: r3 is the view, f11/f12 the
# point's x and y and f13/f0 its u and v, all four loaded above and stored
# below.
[[midasm_hook]]
address = 0x8228BE64
name = "bdCloseUpQuadAnchorHook"
registers = ["r3", "f11", "f12", "f13", "f0"]
after_instruction = true

# Then by the one staging the same points for the frame's miter math, off the
# same view in r31. Writes only stack locals.
[[midasm_hook]]
address = 0x8228B908
name = "bdCloseUpFrameAnchorHook"
registers = ["r31", "f0", "f13"]
after_instruction = true

# SimpleStatusTask's party cards, the row of HP/MP panels along the canvas'
# bottom edge. Their mode setter reads the panel placement out of the d2anime
# bag once per mode change: f31 already holds field_from_y/battle_from_y and
# f30 takes field_to_y/battle_to_y here, the y the slide-in settles on.
[[midasm_hook]]
address = 0x8237180C
name = "bdPartyPanelSlideAnchorHook"
registers = ["f30", "f31"]
after_instruction = true

# Then field_pos/battle_pos, the base the rows are laid out from before that
# slide runs, with f13 taking its y four instructions ahead of the store.
[[midasm_hook]]
address = 0x82371824
name = "bdPartyPanelBaseAnchorHook"
registers = ["f13"]
after_instruction = true

# Loader::vf03, on the path that fades the now-loading wheel in: every frame the
# wheel is up it pushes an alpha into the wheel's d2anime var bag, which is also
# where the wheel's position lives. r31 is the Loader, and the bag is two loads
# off it.
#
# The hook sits ahead of the whole call setup rather than on the call itself.
# Setting a var from here runs guest code, which takes the same volatile
# registers the argument staging below uses, and every one of those is loaded
# after this point.
[[midasm_hook]]
address = 0x821296A8
name = "bdNowLoadingAnchorHook"
registers = ["r31"]
after_instruction = false

[[midasm_hook]]
address = 0x821F9FA4
name = "bdFieldEncounterMenuAnchorHook"
registers = ["f30"]
after_instruction = true

[[midasm_hook]]
address = 0x821F9FD8
name = "bdFieldEncounterPanelAnchorHook"
registers = ["f1"]
after_instruction = true
