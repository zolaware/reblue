# Title menu integration (bodies in src/engine/menus/title_menu.cpp).

# Extend the title menu cursor bounds past the custom rows (config/debug menu/exit).
[[midasm_hook]]
address = 0x820CA654
name = "bdTitleNavBoundsHook"
registers = ["r30", "r31"]
after_instruction = false

# A-button dispatch for the custom title rows; on true jumps past the engine dispatch.
[[midasm_hook]]
address = 0x820CA6C4
name = "bdTitleModsDispatchHook"
registers = ["r31", "r11"]
after_instruction = false
jump_address_on_true = 0x820CA7C8

# No-save boot: block at 0x820CA478 (reachable only with zero saves, +0x98=0, cursor=1)
# would pick disc settings (6) / language (7) / DeviceSelect; force state 2 and jump to
# the state store stw r11, 0x90(r31) at 0x820CA55C.
[[midasm_hook]]
address = 0x820CA488
name = "bdTitleNoSaveMenuHook"
registers = ["r11"]
after_instruction = false
jump_address_on_true = 0x820CA55C

# B in language select (state 7): force next state 2 before the stw r11, 0x90(r31).
[[midasm_hook]]
address = 0x820CA19C
name = "bdTitleNoSaveBackHook7"
registers = ["r11", "r31"]
after_instruction = false

# Same next state store for disc settings (state 6).
[[midasm_hook]]
address = 0x820CA368
name = "bdTitleNoSaveBackHook6"
registers = ["r11", "r31"]
after_instruction = false

# The title polls confirm and cancel by number instead of through the table
# bdGetCurrentMapPath selects, so the Type B swap stopped at the title screen.
# Placed on the mr that follows each li r5, so r5 still names which of the two
# the call site is asking about. Three state blocks: voice/language select,
# disc settings, and the row list.
[[midasm_hook]]
address = 0x820CA11C
name = "bdTitleActionButtonHook"
registers = ["r5"]
after_instruction = false

[[midasm_hook]]
address = 0x820CA130
name = "bdTitleActionButtonHook"
registers = ["r5"]
after_instruction = false

[[midasm_hook]]
address = 0x820CA324
name = "bdTitleActionButtonHook"
registers = ["r5"]
after_instruction = false

[[midasm_hook]]
address = 0x820CA338
name = "bdTitleActionButtonHook"
registers = ["r5"]
after_instruction = false

[[midasm_hook]]
address = 0x820CA5FC
name = "bdTitleActionButtonHook"
registers = ["r5"]
after_instruction = false

[[midasm_hook]]
address = 0x820CA610
name = "bdTitleActionButtonHook"
registers = ["r5"]
after_instruction = false
